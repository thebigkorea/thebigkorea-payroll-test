<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>더큰코리아 급여관리 테스트</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f1eb;color:#25180f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif}button,input,select,textarea{font:inherit}.head{background:linear-gradient(135deg,#3d2414,#74472b);color:#fff;padding:25px 18px}.head>div,.wrap{width:min(1400px,calc(100% - 28px));margin:auto}.head h1{margin:0;font-size:27px}.head p{margin:8px 0 0;opacity:.85}.wrap{padding:20px 0 40px}.card{background:#fff;border:1px solid #e2d6ca;border-radius:17px;padding:17px;margin-bottom:15px;box-shadow:0 6px 19px rgba(67,42,24,.07)}.login{max-width:500px;margin:40px auto;padding:27px}.login h2{margin-top:0}label{display:block;font-size:13px;font-weight:800;color:#59483b}input,select,textarea{width:100%;margin-top:6px;padding:10px 11px;border:1px solid #d7ccc1;border-radius:10px;background:#fff}.btn{border:0;border-radius:10px;padding:10px 14px;background:#4b2d1a;color:#fff;font-weight:800;cursor:pointer}.btn.blue{background:#2563eb}.btn.green{background:#15803d}.btn.gray{background:#70655d}.btn.small{padding:7px 10px;font-size:12px}.login .btn{width:100%;margin-top:14px}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.toolbar label{min-width:180px;flex:1}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}.stat{background:#fff;border:1px solid #e2d6ca;border-radius:14px;padding:15px}.stat span{display:block;color:#817267;font-size:12px}.stat strong{font-size:23px}.table-wrap{overflow:auto;border:1px solid #e2d6ca;border-radius:13px}table{width:100%;min-width:1050px;border-collapse:collapse}th,td{padding:11px 9px;border-bottom:1px solid #eee7df;text-align:center;font-size:13px;white-space:nowrap}th{background:#eee4da;position:sticky;top:0}.left{text-align:left}.badge{padding:4px 8px;border-radius:99px;font-weight:800}.wait{background:#fef3c7;color:#92400e}.saved{background:#dbeafe;color:#1e40af}.confirmed{background:#dcfce7;color:#166534}.modal{display:none;position:fixed;inset:0;background:rgba(20,12,8,.58);z-index:20;overflow:auto;padding:15px}.modal.open{display:block}.box{width:min(980px,100%);margin:20px auto;background:#fff;border-radius:18px;overflow:hidden}.mhead{display:flex;justify-content:space-between;align-items:center;padding:16px 19px;background:#f1e9e1}.mhead h2{margin:0}.close{border:0;background:none;font-size:28px}.summary{padding:13px 19px;background:#fffaf5;border-bottom:1px solid #e2d6ca}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:18px}.section{grid-column:1/-1;color:#4b2d1a;font-weight:900;border-bottom:1px solid #e2d6ca;padding:5px 0}.full{grid-column:1/-1}.totals{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.total{border-radius:12px;padding:13px;background:#f5f1eb}.total strong{display:block;font-size:21px;margin-top:4px}.actions{display:flex;justify-content:flex-end;gap:8px;padding:15px 18px;background:#faf8f6;border-top:1px solid #e2d6ca}.notice{display:none;margin-top:10px;padding:11px;border-radius:10px}.notice.show{display:block}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}.hidden{display:none!important}
.slip{display:none}.slip h1{text-align:center}.slip table{width:100%;min-width:0;border-collapse:collapse;table-layout:fixed;border:1px solid #444}.slip td,.slip th{border:1px solid #444;padding:10px 8px;white-space:normal}.slip thead th,.slip tfoot th{background:#f1f1f1}.slip .sign{text-align:right;margin-top:25px;font-weight:800}.slip.image-export{display:block!important;position:fixed;left:-10000px;top:0;width:800px;padding:38px;background:#fff;color:#25180f;z-index:-1}
@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.section,.full{grid-column:1}.totals{grid-template-columns:1fr}.head>div,.wrap{width:calc(100% - 18px)}}
@media print{html,body{height:auto!important;overflow:visible!important;background:#fff!important}.head,.wrap,.modal{display:none!important}.slip{display:block!important;position:static!important;inset:auto!important;width:100%!important;margin:0!important;padding:25px!important;background:#fff!important}.slip,.slip *{visibility:visible!important}.slip table{width:100%;border-collapse:collapse!important;table-layout:fixed;border:1px solid #444!important}.slip thead,.slip tbody,.slip tfoot,.slip tr{break-inside:avoid}.slip th,.slip td{border:1px solid #444!important;padding:10px 8px!important;white-space:normal!important}.slip thead th,.slip tfoot th{background:#f1f1f1!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.slip tfoot th{font-weight:900}}
</style></head><body>
<header class="head"><div><h1>급여관리 독립 테스트</h1><p>기존 시스템과 분리하여 급여대장 계산과 개인별 급여명세서를 검증합니다.</p></div></header>
<main class="wrap">
<section id="login" class="card login"><h2>테스트 관리자 확인</h2><p>급여 테스트용 관리자 비밀번호를 입력하세요.</p><label>비밀번호<input id="pin" type="password" inputmode="numeric"></label><button id="loginBtn" class="btn" onclick="login()">테스트 시작</button><div id="loginMsg" class="notice"></div></section>
<section id="app" class="hidden">
<div class="stats"><div class="stat"><span>대상 직원</span><strong id="cnt">0명</strong></div><div class="stat"><span>저장 완료</span><strong id="savedCnt">0명</strong></div><div class="stat"><span>확정</span><strong id="confirmedCnt">0명</strong></div><div class="stat"><span>실지급 합계</span><strong id="netSum">0원</strong></div></div>
<section class="card"><div class="toolbar"><label>급여월<input id="month" type="month"></label><label>점포<select id="store" onchange="render()"><option value="">전체 점포</option></select></label><label>직원 검색<input id="keyword" type="search" oninput="render()" placeholder="이름·직책"></label><button class="btn" onclick="load()">조회</button></div><div id="mainMsg" class="notice"></div></section>
<section class="card"><div class="table-wrap"><table><thead><tr><th>점포</th><th>직원</th><th>직책</th><th>급여형태</th><th>지급합계</th><th>공제합계</th><th>실지급액</th><th>상태</th><th>관리</th></tr></thead><tbody id="body"><tr><td colspan="9">급여월을 선택하고 조회하세요.</td></tr></tbody></table></div></section>
</section></main>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="box"><div class="mhead"><h2>직원 급여 계산</h2><button class="close" onclick="closeModal()">×</button></div><div class="summary"><strong id="empName"></strong><div id="empInfo"></div></div>
<div class="grid"><input id="employeeId" type="hidden"><div class="section">지급항목</div>
<label>기본급<input class="calc earn" id="basePay" type="text" inputmode="numeric"></label><label>연장수당<input class="calc earn" id="overtimePay" type="text" inputmode="numeric"></label><label>직무수당<input class="calc earn" id="jobAllowance" type="text" inputmode="numeric"></label><label>직책수당<input class="calc earn" id="positionAllowance" type="text" inputmode="numeric"></label><label>추가근무수당<input class="calc earn" id="extraWorkPay" type="text" inputmode="numeric"></label><label>미휴무수당<input class="calc earn" id="compLeavePay" type="text" inputmode="numeric"></label><label>식대<input class="calc earn" id="mealAllowance" type="text" inputmode="numeric"></label><label>차량유지비<input class="calc earn" id="vehicleAllowance" type="text" inputmode="numeric"></label><label>기타지급<input class="calc earn" id="otherPay" type="text" inputmode="numeric"></label>
<div class="section">공제항목</div><label>국민연금<input class="calc deduct" id="pension" type="text" inputmode="numeric"></label><label>건강보험<input class="calc deduct" id="health" type="text" inputmode="numeric"></label><label>장기요양보험<input class="calc deduct" id="longTermCare" type="text" inputmode="numeric"></label><label>고용보험<input class="calc deduct" id="employmentInsurance" type="text" inputmode="numeric"></label><label>소득세<input class="calc deduct" id="incomeTax" type="text" inputmode="numeric"></label><label>지방소득세<input class="calc deduct" id="localIncomeTax" type="text" inputmode="numeric"></label><label>기타공제<input class="calc deduct" id="otherDeduction" type="text" inputmode="numeric"></label>
<div class="section">급여기준</div><label>급여형태<select id="payType"><option>월급제</option><option>시급제</option><option>일급제</option></select></label><label>소득구분<select id="incomeType"><option>근로소득</option><option>사업소득</option><option>일용근로소득</option></select></label><label>처리자<input id="updatedBy" placeholder="담당자 이름"></label><label class="full">비고<textarea id="note"></textarea></label>
<div class="totals"><div class="total">지급합계<strong id="gross">0원</strong></div><div class="total">공제합계<strong id="deduct">0원</strong></div><div class="total">실지급액<strong id="net">0원</strong></div></div></div><div id="modalMsg" class="notice" style="margin:0 18px 12px"></div><div class="actions"><button class="btn gray" onclick="closeModal()">닫기</button><button class="btn" onclick="previewSlip()">명세서 미리보기</button><button class="btn" onclick="makeKakaoImage()">카톡용 이미지</button><button id="saveBtn" class="btn blue" onclick="save()">저장</button><button id="confirmBtn" class="btn green" onclick="confirmPay()">최종 확정</button></div></div></div>

<section id="slip" class="slip"><h1>급여명세서</h1><p id="slipCompany">㈜더큰코리아</p><p><strong id="slipMonth"></strong> · <span id="slipName"></span></p><table><thead><tr><th>지급항목</th><th>금액</th><th>공제항목</th><th>금액</th></tr></thead><tbody id="slipBody"></tbody><tfoot><tr><th>지급합계</th><th id="slipGross"></th><th>공제합계</th><th id="slipDeduct"></th></tr><tr><th colspan="3">실지급액</th><th id="slipNet"></th></tr></tfoot></table><p class="sign">㈜더큰코리아</p></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbx8whuAGHuhAg3fhffsZSIJQI7m2RDXN4s9Mm44cF27KjSIFYMelqgYpVMbeQuTBv8/exec";let pin="",employees=[],payrolls=[];const earnIds=["basePay","overtimePay","jobAllowance","positionAllowance","extraWorkPay","compLeavePay","mealAllowance","vehicleAllowance","otherPay"],deductIds=["pension","health","longTermCare","employmentInsurance","incomeTax","localIncomeTax","otherDeduction"];
const $=id=>document.getElementById(id),won=v=>Number(v||0).toLocaleString("ko-KR")+"원",num = id => {
  const value = String($(id).value || "")
    .replace(/[^\d]/g, "");

  return Math.max(0, Number(value || 0));
};
function formatMoneyInput(input) {
  const digits = String(input.value || "").replace(/[^\d]/g, "");
  input.value = digits ? Number(digits).toLocaleString("ko-KR") : "0";
}
function msg(id,type,text){$(id).className="notice show "+type;$(id).textContent=text}function clear(id){$(id).className="notice";$(id).textContent=""}
async function post(data){if(!API_URL.startsWith("https://script.google.com/macros/s/"))throw Error("HTML의 API_URL에 급여 테스트 웹앱 주소를 입력하세요.");const r=await fetch(API_URL,{method:"POST",body:JSON.stringify({...data,adminPin:pin})});const j=await r.json();if(!j.ok)throw Error(j.message||"처리 실패");return j}
function thisMonth(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}$("month").value=thisMonth();
async function login(){pin=$("pin").value.trim();if(!pin)return msg("loginMsg","err","비밀번호를 입력하세요.");try{await load();$("login").classList.add("hidden");$("app").classList.remove("hidden")}catch(e){msg("loginMsg","err",e.message)}}
async function load(){clear("mainMsg");try{const r=await post({action:"getPayrollData",month:$("month").value});employees=Array.isArray(r.employees)?r.employees:[];payrolls=Array.isArray(r.payrolls)?r.payrolls:[];const stores=Array.isArray(r.stores)?r.stores:Object.values(employees.reduce((map,e)=>{if(e.storeId&&!map[e.storeId])map[e.storeId]={storeId:e.storeId,storeName:e.storeName||e.storeId};return map},{})).sort((a,b)=>a.storeName.localeCompare(b.storeName,"ko"));$("store").innerHTML='<option value="">전체 점포</option>'+stores.map(s=>`<option value="${s.storeId}">${s.storeName}</option>`).join("");render()}catch(e){msg($("app").classList.contains("hidden")?"loginMsg":"mainMsg","err",e.message);throw e}}
function render(){const s=$("store").value,k=$("keyword").value.toLowerCase();const list=employees.filter(e=>(!s||e.storeId===s)&&(!k||`${e.name} ${e.position}`.toLowerCase().includes(k)));const map=Object.fromEntries(payrolls.map(p=>[p.employeeId,p]));$("body").innerHTML=list.length?list.map(e=>{const p=map[e.employeeId],st=p?.status||"미작성",cls=st==="확정"?"confirmed":p?"saved":"wait",buttonText=!p?"작성":st==="확정"?"명세서 보기":"조회·수정";return `<tr><td class="left">${e.storeName}</td><td><strong>${e.name}</strong></td><td>${e.position||"-"}</td><td>${p?.payType||e.payType||"-"}</td><td>${p?won(p.grossPay):"-"}</td><td>${p?won(p.totalDeduction):"-"}</td><td>${p?won(p.netPay):"-"}</td><td><span class="badge ${cls}">${st}</span></td><td><button class="btn small" onclick="openPay('${e.employeeId}')">${buttonText}</button></td></tr>`}).join(""):'<tr><td colspan="9">직원이 없습니다.</td></tr>';const saved=payrolls.length,confirmed=payrolls.filter(p=>p.status==="확정").length;$("cnt").textContent=employees.length+"명";$("savedCnt").textContent=saved+"명";$("confirmedCnt").textContent=confirmed+"명";$("netSum").textContent=won(payrolls.reduce((a,p)=>a+p.netPay,0))}
function openPay(id){clear("modalMsg");const e=employees.find(x=>x.employeeId===id),p=payrolls.find(x=>x.employeeId===id)||{},locked=p.status==="확정";$("employeeId").value=id;$("empName").textContent=e.name;$("empInfo").textContent=[e.storeName,e.position,e.employmentType,locked?"확정완료":""].filter(Boolean).join(" · ");[...earnIds,...deductIds].forEach(x=>$(x).value=Number(p[x]||0).toLocaleString("ko-KR"));$("payType").value=p.payType||e.payType||"월급제";$("incomeType").value=p.incomeType||((e.employmentType||"").includes("사업")?"사업소득":"근로소득");$("updatedBy").value=p.updatedBy||"";$("note").value=p.note||"";document.querySelectorAll(".grid input,.grid select,.grid textarea").forEach(el=>el.disabled=locked);$("saveBtn").classList.toggle("hidden",locked);$("confirmBtn").classList.toggle("hidden",locked);if(locked)msg("modalMsg","ok","최종 확정된 급여입니다. 인쇄와 카톡용 이미지만 이용할 수 있습니다.");calc();$("modal").classList.add("open")}
function closeModal(){$("modal").classList.remove("open")}function calc(){const g=earnIds.reduce((a,x)=>a+num(x),0),d=deductIds.reduce((a,x)=>a+num(x),0);$("gross").textContent=won(g);$("deduct").textContent=won(d);$("net").textContent=won(g-d);return{g,d,n:g-d}}
document.querySelectorAll(".calc").forEach(function(input){
  input.addEventListener("input",function(){
    formatMoneyInput(input);
    calc();
  });
  input.addEventListener("focus",function(){
    input.select();
  });
});
function data(){return{payType:$("payType").value,incomeType:$("incomeType").value,note:$("note").value,...Object.fromEntries([...earnIds,...deductIds].map(x=>[x,num(x)]))}}
async function save(){if(!$("updatedBy").value.trim())return msg("modalMsg","err","처리자 이름을 입력하세요.");try{const r=await post({action:"savePayroll",month:$("month").value,employeeId:$("employeeId").value,payroll:data(),updatedBy:$("updatedBy").value});msg("modalMsg","ok",r.message);await load()}catch(e){msg("modalMsg","err",e.message)}}
async function confirmPay(){if(!confirm("저장된 급여를 최종 확정하시겠습니까?\n확정 후에는 수정할 수 없습니다."))return;try{const r=await post({action:"confirmPayroll",month:$("month").value,employeeId:$("employeeId").value,updatedBy:$("updatedBy").value});await load();closeModal();msg("mainMsg","ok",r.message+" 확정된 급여는 수정할 수 없습니다.")}catch(e){msg("modalMsg","err",e.message)}}
function buildSlip(){const e=employees.find(x=>x.employeeId===$("employeeId").value),labels={basePay:"기본급",overtimePay:"연장수당",jobAllowance:"직무수당",positionAllowance:"직책수당",extraWorkPay:"추가근무수당",compLeavePay:"미휴무수당",mealAllowance:"식대",vehicleAllowance:"차량유지비",otherPay:"기타지급",pension:"국민연금",health:"건강보험",longTermCare:"장기요양보험",employmentInsurance:"고용보험",incomeTax:"소득세",localIncomeTax:"지방소득세",otherDeduction:"기타공제"};const max=Math.max(earnIds.length,deductIds.length),rows=[];for(let i=0;i<max;i++)rows.push(`<tr><td>${labels[earnIds[i]]||"&nbsp;"}</td><td>${earnIds[i]?won(num(earnIds[i])):"&nbsp;"}</td><td>${labels[deductIds[i]]||"&nbsp;"}</td><td>${deductIds[i]?won(num(deductIds[i])):"&nbsp;"}</td></tr>`);const t=calc();$("slipMonth").textContent=$("month").value+" 급여";$("slipName").textContent=e.name+" / "+e.storeName;$("slipBody").innerHTML=rows.join("");$("slipGross").textContent=won(t.g);$("slipDeduct").textContent=won(t.d);$("slipNet").textContent=won(t.n);return e}
function previewSlip(){buildSlip();window.print()}
async function makeKakaoImage(){clear("modalMsg");if(typeof html2canvas!=="function")return msg("modalMsg","err","이미지 기능을 불러오지 못했습니다. 새로고침 후 다시 시도하세요.");const e=buildSlip(),slip=$("slip");slip.classList.add("image-export");try{const canvas=await html2canvas(slip,{backgroundColor:"#ffffff",scale:2,useCORS:true,logging:false});const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/png"));if(!blob)throw new Error("이미지를 만들지 못했습니다.");let copied=false;if(navigator.clipboard&&window.ClipboardItem){try{await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]);copied=true}catch(ignore){}}const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`${$("month").value}_${e.name}_급여명세서.png`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);msg("modalMsg","ok",copied?"카톡용 이미지를 복사하고 저장했습니다. 카카오톡에서 붙여넣기 하세요.":"카톡용 이미지를 저장했습니다. 다운로드한 이미지를 카카오톡으로 보내세요.")}catch(error){msg("modalMsg","err",error.message||"카톡용 이미지 생성에 실패했습니다.")}finally{slip.classList.remove("image-export")}}
$("pin").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
</script></body></html>
